<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homebrew</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 32px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
            margin-top: 0;
            border-bottom: 1px solid #30363d;
            padding-bottom: 8px;
        }
        p {
            line-height: 1.6;
        }
        .img-container {
            margin-top: 20px;
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid #30363d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mi Proyecto Homebrew</h1>
        <p>Bienvenido a mi sitio web alojado en GitHub. Este es un diseño en tema oscuro.</p>
        
        <div class="img-container">
            <img src="https://www.snow-forecast.com/assets/scales/rainandsnowscalesum.metric-96cfe7c1a57d87314801f40f0571f27bccbb9261e1be0fc036df2721933745c9.gif" alt="Mi imagen">
        </div>
    </div>
</body>
</html>
